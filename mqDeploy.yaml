apiVersion: mq.ibm.com/v1beta1
kind: QueueManager
metadata:
  name: mq3
  namespace: mq
spec:
  license:
    accept: true
    license: L-CYPF-CRPF3H
    use: Production
  queueManager:
    imagePullPolicy: Always
    storage:
      queueManager:
        enabled: true
    availability:
      #type: NativeHA
      type: SingleInstance
    name: QM1
    mqsc:
    - configMap:
        name: mq3-mqsc
        items:
        - ivt.mqsc
    ini:
    - configMap:
        name: mq3-mqsc
        items:
        - mq.ini
  version: 9.4.3.1-r3
  web:
    enabled: true
  pki:
    keys:
      - name: label1
        secret:
          secretName: mq3key
          items:
            - tls.key
            - tls.crt
