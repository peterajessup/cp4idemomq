apiVersion: v1
kind: ConfigMap
metadata:
  name: mq2-mqsc
data:
  ivt.mqsc: |
    DEFINE CHANNEL(TLSCONN) CHLTYPE(SVRCONN) SSLCIPH(ANY_TLS12_OR_HIGHER) CERTLABL('label1') SSLCAUTH (OPTIONAL) REPLACE
    SET CHLAUTH(TLSCONN) TYPE(BLOCKUSER) USERLIST(nobody)
    SET CHLAUTH(TLSCONN) TYPE (ADDRESSMAP) ADDRESS(*) MCAUSER('user1') ACTION(REPLACE)
    DEFINE CHANNEL(ACE.CONN) CHLTYPE(SVRCONN) REPLACE
    SET CHLAUTH(ACE.CONN) TYPE(BLOCKUSER) USERLIST(nobody)
    SET CHLAUTH(ACE.CONN) TYPE (ADDRESSMAP) ADDRESS(*) MCAUSER('user1')
    ALTER AUTHINFO(SYSTEM.DEFAULT.AUTHINFO.IDPWOS) AUTHTYPE(IDPWOS) CHCKCLNT(NONE) ADOPTCTX(NO)
    REFRESH SECURITY TYPE(CONNAUTH)
    DEFINE QLOCAL(IVT.Q) DEFPSIST(YES) MAXDEPTH(50000) REPLACE
    DEFINE QLOCAL(IVT.R) DEFPSIST(YES) MAXDEPTH(5000000) REPLACE
    DEFINE QLOCAL(IVT.P) DEFPSIST(YES) MAXDEPTH(5000000) REPLACE
    SET AUTHREC PRINCIPAL('user1') OBJTYPE(QMGR) AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(QUEUE) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(TOPIC) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(PROCESS) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(NAMELIST) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(CHANNEL) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(LISTENER) PRINCIPAL('user1') AUTHADD(ALL)
    SET AUTHREC PROFILE(*) OBJTYPE(SERVICE) PRINCIPAL('user1') AUTHADD(ALL)
    
  mq.ini: |-
    Service:
      Name=AuthorizationService
      EntryPoints=14
      SecurityPolicy=UserExternal
